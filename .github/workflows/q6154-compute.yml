name: q6154-full

on:
  push:
    branches: [q6154-full]
    paths:
      - 'q6154/**'
      - '.github/workflows/q6154-compute.yml'

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q6154-full
          fetch-depth: 0
      - name: Full exact verification
        shell: bash
        run: |
          set -o pipefail
          bash q6154/run.sh 2>&1 | tee q6154/run.log
      - name: Commit output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f q6154
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Q6154 q5000 output [skip ci]"
          git push origin HEAD:q6154-full
